[client]
body_size_limit=1024

[server.main]
root_destination=examples/main
address=localhost
port=8080
host=main.srm.com

[server.main.error_pages]
use_root_destination=true
destination=/errors

[server.main.route]
use_root_destination=true
path=/
directory_listing=false
destination=./
methods=GET,OPTIONS

[server.main.route]
use_root_destination=false
path=/docs
directory_listing=false
destination=examples/docs
methods=GET,OPTIONS
